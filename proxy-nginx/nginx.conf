# Same a CPU core you have
# worker_processes auto;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    upstream nodejs_cluster {
        least_conn;
        server 127.0.0.1:1501; # Docker container 1
        server 127.0.0.1:1502; # Docker container 2
        server 127.0.0.1:1503; # Docker container 3
    }

    server {
        # listen 8080;
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl-keys/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl-keys/nginx-selfsigned.key;

        location / {
            # Proxy server
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Redirect 
    server{
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}